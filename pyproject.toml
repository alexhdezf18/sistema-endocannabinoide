[project]
name = "sistema-endocannabinoide"
version = "0.1.0"
description = "Mapa y modelo del sistema endocannabinoide humano"
authors = [
    { name = "Alex Hernandez", email = "alexhdezf18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brainsmash==0.11.0",
    "ipykernel==7.4.0",
    "jupyterlab==4.6.4",
    "matplotlib==3.11.2",
    "nibabel==5.4.2",
    "nilearn==0.14.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
]

[project.scripts]
sistema-endocannabinoide = "sistema_endocannabinoide:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
